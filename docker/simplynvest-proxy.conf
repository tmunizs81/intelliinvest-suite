# ============================================
# SimplyNvest — Reverse proxy (HARDENED)
# ============================================
# Este arquivo isola 100% o SimplyNvest do restante da VPS.
#
# COMO INSTALAR (uma vez):
#   sudo cp docker/simplynvest-proxy.conf /etc/nginx/sites-available/simplynvest
#   sudo ln -sf /etc/nginx/sites-available/simplynvest /etc/nginx/sites-enabled/simplynvest
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d simplynvest.t2systems.com.br
#
# ⚠️  IMPORTANTE — POR QUE O SIMPLYNVEST ESTAVA CARREGANDO OUTRO SISTEMA
# ------------------------------------------------------------------------
# Se um bloco `server` em outro arquivo tem `listen 443 ssl default_server`
# (ou `listen 80 default_server`) SEM `server_name` batendo com o simplynvest,
# o Nginx usa esse bloco default como fallback e serve o outro sistema no
# domínio do simplynvest até que o TLS/handshake resolva o SNI.
#
# A correção é:
#   1) Manter APENAS UM bloco `default_server` na VPS (o do sistema padrão).
#   2) Este arquivo define `server_name` explícito (não é default) e responde
#      SOMENTE ao host simplynvest.t2systems.com.br.
#   3) Um bloco extra "catch-all" fecha o gap: se um cliente bater neste vhost
#      sem enviar o Host correto, devolvemos 444 (close) em vez de vazar HTML
#      de outro app.
#
# Auditoria rápida na VPS:
#   sudo nginx -T | grep -nE "server_name|default_server|listen " | less
# ============================================

# --- HTTP: redireciona tudo pra HTTPS -------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name simplynvest.t2systems.com.br;
    return 301 https://$host$request_uri;
}

# --- HTTPS: proxy real ----------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name simplynvest.t2systems.com.br;

    # Certificados (ajuste se necessário — certbot preenche automaticamente)
    ssl_certificate     /etc/letsencrypt/live/simplynvest.t2systems.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/simplynvest.t2systems.com.br/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    access_log /var/log/nginx/simplynvest-access.log;
    error_log  /var/log/nginx/simplynvest-error.log;
    client_max_body_size 10M;

    # Impede qualquer isolamento local: SEM root/alias/try_files aqui.
    # Tudo vai para o container do SimplyNvest na porta 3080.
    location / {
        proxy_pass http://127.0.0.1:3080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # Índice/HTML NUNCA em cache — evita servir bundle antigo após deploy
        # ou HTML de outro vhost após Ctrl+Shift+R.
        add_header Cache-Control "no-store, must-revalidate" always;
    }

    # Assets versionados podem ser cacheados agressivamente
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp|avif)$ {
        proxy_pass http://127.0.0.1:3080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 7d;
        add_header Cache-Control "public, immutable" always;
    }
}

# --- Catch-all defensivo --------------------------------------------------
# Se algum cliente/bot bater neste servidor com Host diferente,
# fechamos a conexão em vez de responder com o site errado.
# NÃO transforme este bloco em default_server — deixe o default do
# sistema principal da VPS intocado.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name _;

    # Reutiliza o mesmo cert; se não existir, remova essas duas linhas
    ssl_certificate     /etc/letsencrypt/live/simplynvest.t2systems.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/simplynvest.t2systems.com.br/privkey.pem;

    # Só ativa se o pedido chegar EXPLICITAMENTE mirando o IP/host do
    # SimplyNvest sem SNI válido. Fecha silenciosamente.
    if ($host != "simplynvest.t2systems.com.br") { return 444; }
    return 444;
}
